<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="description" content="FarmaApp — Assistente farmacêutico no seu bolso para receitas, interações, cálculos e pedidos" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FarmaApp" />

  <title>FarmaApp — Assistente Farmacêutico</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- Favicon / Apple Touch Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192x192.png" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pharma: {
              50:  '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Dexie.js via CDN -->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased select-none">

  <!-- App Root -->
  <div id="app">
    <!-- Loading state while JS initializes -->
    <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-emerald-600 to-emerald-800 text-white">
      <div class="text-6xl mb-4 animate-bounce">💊</div>
      <h1 class="text-2xl font-black tracking-tight">FarmaApp</h1>
      <p class="text-emerald-200 text-xs mt-1">Carregando assistente farmacêutico...</p>
    </div>
  </div>

  <!-- App Module (ES Module) -->
  <script type="module" src="./src/app.js"></script>

</body>
</html>
